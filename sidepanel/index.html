<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FE Lens</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../icons/icon-32.png" width="20" height="20" alt="">
      <span>FE Lens</span>
    </div>
    <div class="fw" id="fw" aria-live="polite"></div>
    <button type="button" class="btn primary" id="pick" aria-pressed="false" title="Pick an element (Alt+Shift+X)">
      <svg aria-hidden="true" viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 1v4M10 15v4M1 10h4M15 10h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Pick</span>
    </button>
    <button type="button" class="btn icon" id="settings-btn" popovertarget="settings" aria-label="Settings">
      <svg aria-hidden="true" viewBox="0 0 20 20" width="16" height="16"><path fill="currentColor" d="M8.6 1h2.8l.4 2.3 1.5.8 2.2-.9 1.4 2.4-1.8 1.5v1.8l1.8 1.5-1.4 2.4-2.2-.9-1.5.8-.4 2.3H8.6l-.4-2.3-1.5-.8-2.2.9-1.4-2.4 1.8-1.5V8.1L3.1 6.6l1.4-2.4 2.2.9 1.5-.8L8.6 1ZM10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
    </button>
  </header>

  <div id="health" class="health-strip" aria-label="Problems on this page" hidden></div>

  <div id="settings" popover class="settings">
    <form id="settings-form">
      <h2>Settings</h2>
      <label for="root">Project folder</label>
      <input id="root" name="root" type="text" spellcheck="false" autocomplete="off" placeholder="C:\work\my-app">
      <p class="help">Used to open files in your editor. The folder that contains <code>src/</code>.</p>
      <label for="editor">Editor</label>
      <select id="editor" name="editor">
        <option value="vscode">VS Code</option>
        <option value="cursor">Cursor</option>
        <option value="webstorm">WebStorm</option>
      </select>
      <div class="row">
        <button type="submit" class="btn primary">Save</button>
        <span class="saved" id="saved" role="status"></span>
      </div>
    </form>
  </div>

  <div class="tabs">
    <div class="tablist" focusgroup="tablist nomemory" aria-label="FE Lens views">
      <button type="button" role="tab" id="tab-inspect" aria-selected="true" focusgroupstart>Inspect</button>
      <button type="button" role="tab" id="tab-network">Network and errors <span class="count" id="net-count"></span> <span class="count bad" id="err-count"></span></button>
    </div>

    <main class="panels">
      <section role="tabpanel" id="panel-inspect" aria-labelledby="tab-inspect">
        <div class="wrap" id="inspect"></div>
      </section>

      <section role="tabpanel" id="panel-network" aria-labelledby="tab-network" hidden>
        <div class="net-stack">
          <div id="net-list-view" class="wrap">
            <p class="net-summary" id="net-summary"></p>
            <div class="statbar" id="net-bar" aria-hidden="true"></div>
            <section class="codes" id="net-codes" aria-labelledby="codes-h" hidden>
              <header><h2 id="codes-h">Responses by status code</h2><button type="button" class="btn ghost small codes-reset" hidden>Show all</button></header>
              <div class="codes-list" role="group" aria-label="Filter by status code"></div>
            </section>
            <div class="typebar" id="net-types" role="group" aria-label="Filter by type">
              <button type="button" data-value="all" aria-pressed="true">All<span class="n"></span></button>
              <button type="button" data-value="api" aria-pressed="false">API <span class="n"></span></button>
              <button type="button" data-value="doc" aria-pressed="false">Doc <span class="n"></span></button>
              <button type="button" data-value="js" aria-pressed="false">JS <span class="n"></span></button>
              <button type="button" data-value="css" aria-pressed="false">CSS <span class="n"></span></button>
              <button type="button" data-value="img" aria-pressed="false">Img <span class="n"></span></button>
              <button type="button" data-value="font" aria-pressed="false">Font <span class="n"></span></button>
              <button type="button" data-value="other" aria-pressed="false">Other <span class="n"></span></button>
              <button type="button" data-value="error" aria-pressed="false">Errors <span class="n"></span></button>
            </div>
            <div class="toolbar">
              <input type="search" id="net-q" placeholder="Filter by URL, status or error text" aria-label="Filter requests and errors">
              <label class="toggle"><input type="checkbox" id="net-problems"> Problems only</label>
              <button type="button" class="btn ghost small" id="net-clear">Clear</button>
            </div>
            <table class="net-table" id="net-table">
              <thead>
                <tr>
                  <th scope="col" class="c-name"><button type="button" data-sort="name">Name<span class="sort-ico" aria-hidden="true"></span></button></th>
                  <th scope="col" class="c-status"><button type="button" data-sort="status">Status<span class="sort-ico" aria-hidden="true"></span></button></th>
                  <th scope="col" class="c-type"><button type="button" data-sort="type">Type<span class="sort-ico" aria-hidden="true"></span></button></th>
                  <th scope="col" class="c-size"><button type="button" data-sort="size">Size<span class="sort-ico" aria-hidden="true"></span></button></th>
                  <th scope="col" class="c-time"><button type="button" data-sort="time">Time<span class="sort-ico" aria-hidden="true"></span></button></th>
                  <th scope="col" class="c-wf">Waterfall</th>
                </tr>
              </thead>
              <tbody id="net-rows"></tbody>
            </table>
            <span id="net-sort-status" role="status" class="sr-only"></span>
            <p class="empty" id="net-empty">No requests or errors yet. Use the app and they show up here.</p>
            <p class="empty" id="net-nomatch" hidden>Nothing matches these filters.</p>
          </div>
          <div id="net-detail" class="net-detail" hidden></div>
        </div>
      </section>

    </main>
  </div>

  <div id="offline" class="offline" hidden></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
